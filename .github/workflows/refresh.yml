name: refresh

on:
  schedule:
    # Every 5 minutes. This is GitHub Actions' HARD MINIMUM interval — you cannot
    # schedule any faster (cron '*/1' etc. is silently clamped to ~5 min). This is
    # already 3x more frequent than a 15-minute cadence. On a PUBLIC repo (this one)
    # Actions minutes are free & unlimited, so this is the fastest, most aggressive
    # refresh possible. Note: under heavy GitHub load, scheduled runs can be delayed
    # or skipped by GitHub itself — that is outside our control and normal.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Cancel any in-progress run when a newer one starts.
# Prevents overlapping deploys and queue pileups on GitHub Actions.
concurrency:
  group: nuzu-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cache pip packages — saves ~15s on every run
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: nuzu-pip-feedparser-requests
          restore-keys: nuzu-pip-

      - name: Install dependencies
        run: pip install --quiet feedparser requests

      - name: Capture pre-run hash of index.html
        id: pre_hash
        run: |
          if [ -f index.html ]; then
            echo "hash=$(sha256sum index.html | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          else
            echo "hash=none" >> $GITHUB_OUTPUT
          fi

      - name: Run main bot (builds index.html)
        run: python bot.py

      - name: Capture post-run hash of index.html
        id: post_hash
        run: |
          if [ -f index.html ]; then
            echo "hash=$(sha256sum index.html | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          else
            echo "hash=none" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated files
        if: steps.pre_hash.outputs.hash != steps.post_hash.outputs.hash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html feed.xml feed.json _headers || true
          git add yesterday_top.json feed_health.json missing_logos.json source_domain_cache.json 2>/dev/null || true
          git add trending_terms.json 2>/dev/null || true
          git add icons/sources/ 2>/dev/null || true
          # NUZU Originals: the in-house byline pages generated from articles/.
          # -A is required on the originals/ folder so that pages for DELETED
          # articles are staged as deletions, not left orphaned on the live site.
          git add originals.html 2>/dev/null || true
          git add -A originals/ 2>/dev/null || true
          git commit -m "Auto-refresh $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
          # Push with retry.
          #
          # A bare "git push" fails outright if anything landed on the branch
          # while this run was building - which is precisely what happens when
          # you upload an article in the middle of a refresh. The run goes red
          # and the article sits unpublished until someone reruns it by hand.
          #
          # Rebasing puts our generated files on top of whatever arrived. An
          # uploaded article only touches articles/, so it never conflicts with
          # the files the bot regenerates.
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git push; then
              PUSHED=1
              break
            fi
            echo "Push rejected (attempt $attempt) - rebasing onto latest and retrying"
            if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"; then
              git rebase --abort 2>/dev/null || true
              echo "Rebase failed - leaving the branch untouched for a human to look at"
              break
            fi
            sleep 3
          done
          if [ "$PUSHED" != "1" ]; then
            echo "Could not push after 5 attempts. The next scheduled run will pick this up."
            exit 1
          fi

      - name: Skip deploy (content unchanged)
        if: steps.pre_hash.outputs.hash == steps.post_hash.outputs.hash
        run: echo "Content hash unchanged — skipping deploy to conserve action minutes."
