name: refresh

on:
  schedule:
    # GitHub's shortest schedule is every 5 minutes, but in practice it starts scheduled runs
    # only every few hours. So once a run starts it keeps building: a new build about every
    # 10 minutes for up to about 5.5 hours (NUZU 2.4). A build takes about a minute.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Never two runs at once. A newer run (the next scheduled one, or Run workflow pressed after an
# upload) cancels the one in progress and takes over the building.
concurrency:
  group: nuzu-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cache pip packages - saves ~15s on every run
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: nuzu-pip-feedparser-requests
          restore-keys: nuzu-pip-

      - name: Install dependencies
        run: pip install --quiet feedparser requests

      - name: Build about every 10 minutes for up to 5.5 hours
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          START=$(date +%s)
          GAP=600          # seconds from the start of one build to the start of the next
          LIMIT=19800      # 330 minutes: no build starts later than this
          N=0
          while true; do
            T0=$(date +%s)
            N=$((N+1))
            echo "::group::Build $N - $(date -u '+%H:%M UTC')"
            # Pick up anything uploaded since the last build (an article, a new bot.py).
            if git fetch --quiet origin "$BRANCH"; then
              git reset --quiet --hard "origin/$BRANCH"
            fi
            if [ -f index.html ]; then PRE=$(sha256sum index.html | cut -d' ' -f1); else PRE=none; fi
            if timeout 15m python bot.py; then
              if [ -f index.html ]; then POST=$(sha256sum index.html | cut -d' ' -f1); else POST=none; fi
              if [ "$PRE" != "$POST" ]; then
                git add index.html feed.xml feed.json _headers || true
                git add health.json 2>/dev/null || true
                git add yesterday_top.json feed_health.json missing_logos.json source_domain_cache.json 2>/dev/null || true
                git add trending_terms.json 2>/dev/null || true
                git add icons/sources/ 2>/dev/null || true
                # NUZU Originals: the in-house byline pages generated from articles/.
                # -A stages the pages of DELETED articles as deletions.
                git add originals.html 2>/dev/null || true
                git add -A originals/ 2>/dev/null || true
                git commit --quiet -m "Auto-refresh $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
                # Push with retry: if something landed meanwhile (an uploaded article), rebase the
                # generated files on top of it. On a conflict, skip; the next build redoes it.
                PUSHED=0
                for attempt in 1 2 3 4 5; do
                  if git push --quiet origin "HEAD:$BRANCH"; then
                    PUSHED=1
                    break
                  fi
                  echo "Push rejected (attempt $attempt) - rebasing onto the latest and retrying"
                  if ! git pull --quiet --rebase --autostash origin "$BRANCH"; then
                    git rebase --abort 2>/dev/null || true
                    echo "Rebase failed - skipping this build; the next build redoes it"
                    break
                  fi
                  sleep 3
                done
                if [ "$PUSHED" != "1" ]; then echo "Not pushed this time; the next build tries again."; fi
              else
                echo "Content unchanged - nothing to push."
              fi
            else
              echo "bot.py failed or took over 15 minutes - the next build tries again."
            fi
            echo "::endgroup::"
            NEXT=$((T0 + GAP))
            if [ $((NEXT - START)) -gt $LIMIT ]; then
              echo "Done: $N builds in this run."
              break
            fi
            NOW=$(date +%s)
            if [ "$NEXT" -gt "$NOW" ]; then sleep $((NEXT - NOW)); fi
          done
